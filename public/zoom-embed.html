<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoom Class</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        /* background: yellow; */
      }
      #meetingSDKElement {
        position: relative;
        width: 100%;
        height: 100vh !important;
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
   #meetingSDKElement div:has(> video-player-container) {
    position: relative !important;
    width: 100% !important;
    height: calc(100vh - 80px) !important;
    min-height: 0 !important;
    max-height: calc(100vh - 80px) !important;
    overflow: hidden !important;
  }

  /* Zoom video container */
  #meetingSDKElement video-player-container {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: calc(100vh - 80px) !important;
  }
  #meetingSDKElement .react-draggable {
  width: 100%;
  height: 100vh !important;
  transform: none !important;
}

/* Zoom resizable wrapper */
#meetingSDKElement .react-resizable {
  width: 100%;
  height: 100% !important;
}
#meetingSDKElement > div[aria-label="Zoom app container"] {
  width: 100%;
  height: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  top: 0 !important;
  left: 0 !important;
  transform: none !important;
}
/* Custom Zoom layout override */

/* Only apply height to the main wrapper or video container to not break toolbar */
#meetingSDKElement .zoom-MuiPaper-root {
  height: calc(100vh - 80px) !important;
  max-height: calc(100vh - 80px) !important;
}

/* Safely center the loading screen without breaking the toolbar */
#meetingSDKElement .zoom-MuiPaper-root:not(:has(button)):not(:has([role="button"])) {
  height: 100vh !important;
  max-height: 100vh !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
}
#meetingSDKElement .zoom-MuiPaper-root .css-108w4cc {
  height: calc(100vh - 80px) !important;
  max-height: calc(100vh - 80px) !important;
}
#meetingSDKElement .zoom-MuiPaper-root .css-1ju5x5d {
  height: calc(100vh - 80px) !important;
  max-height: calc(100vh - 80px) !important;
}


#meetingSDKElement .zoom-MuiPaper-root .css-woj72k{
    height: 100px !important;
}

#meetingSDKElement .zoom-MuiListItem-root {
  height: calc(100vh - 80px) !important;
  /* max-height: calc(100vh - 80px) !important; */
}
#meetingSDKElement .css-anfozm {
  height: calc(100vh - 80px) !important;
  min-height: calc(100vh - 80px) !important;
  max-height: calc(100vh - 80px) !important;
}
#meetingSDKElement .css-xm9rp1 {
  height: calc(100vh - 80px) !important;
  min-height: calc(100vh - 80px) !important;
  max-height: calc(100vh - 80px) !important;
}

#meetingSDKElement video-player-container > div {
  position: relative !important;
  width: 100% !important;
  height: calc(100vh - 80px) !important;
  min-height: calc(100vh - 80px) !important;
  max-height: calc(100vh - 80px) !important;
  margin: 0 !important;
  padding: 0 !important;
}

#meetingSDKElement .css-tnxfbw {
  width: 100% !important;
  height: calc(100vh - 80px) !important;
  min-height: calc(100vh - 80px) !important;
  max-height: calc(100vh - 80px) !important;
  margin: 0 !important;
  padding: 0 !important;
}

#meetingSDKElement .css-itr7u6{
  width: 100% !important;
  height: calc(100vh - 80px) !important;
  min-height: calc(100vh - 80px) !important;
  max-height: calc(100vh - 80px) !important;
  margin: 0 !important;
  padding: 0 !important;
}

/* Override Popper.js positioning to enforce precise gaps and prevent cutoffs */
div[data-popper-placement^="right"] {
  position: fixed !important;
  top: 0 !important;
  bottom: 0 !important;
  right: 8px !important;
  left: auto !important;
  transform: none !important;
  height: 100vh !important;
  z-index: 9999 !important;
}

/* Chat box overrides */
div[data-popper-placement^="right"] .zoom-MuiPaper-root {
  border-radius: 12px !important;
  height: 100vh !important;
  max-height: 100vh !important;
  width: 280px !important;
  max-width: 280px !important;
  min-width: 0 !important;
  margin: 0 !important;
  border: none !important;
  overflow: hidden !important;
  background-color: #1a1a1a !important;
}

/* Enforce video container shrinking using CSS to prevent React overrides */
body.chat-is-open #meetingSDKElement {
  width: calc(100% - 296px) !important;
}

/* Chat inner backgrounds for header and typing area to match the top bar (#1a1a1a) */
div[data-popper-placement^="right"] .zoom-MuiPaper-root > div:first-child,
div[data-popper-placement^="right"] .zoom-MuiPaper-root > div:last-child,
div[data-popper-placement^="right"] .zoom-MuiPaper-root > div > div:first-child,
div[data-popper-placement^="right"] .zoom-MuiPaper-root > div > div:last-child {
  background-color: #1a1a1a !important;
}

/* Messages area slightly darker to differentiate */
#chat-list-content,
.chat-list-content {
  background-color: #111 !important;
}
    </style>
  </head>
  <body>
    <div id="meetingSDKElement"></div>

    <script src="https://source.zoom.us/6.1.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/6.1.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/6.1.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/6.1.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/6.1.0/lib/vendor/lodash.min.js"></script>

    <script src="https://source.zoom.us/zoom-meeting-embedded-6.1.0.min.js"></script>

    <script>
      let client;
      let joinLock = false;
      let leaveLock = false;
      let currentConfig = null;
      let containerObserver = null;
      let chatObserver = null;
      let isChatOpen = false;
      const CHAT_SPACE = 310; // 280px chat + 15px gap on right + 15px gap on left

      const normalizeError = (err) => {
        const code = err.errorCode || err.code || 0;
        const type = err.type || "SDK_ERROR";
        let message =
          err.errorMessage ||
          err.message ||
          err.reason ||
          "An unexpected Zoom SDK error occurred.";

        if (code === 3633) {
          message =
            "The live class has not been started by the instructor yet. Please wait a moment.";
        } else if (code === 1 || code === 2) {
          message =
            "Failed to connect to Zoom servers. Please check your internet connection.";
        } else if (code === 3001) {
          message = "The Zoom meeting ID is invalid or has expired.";
        } else if (code === 3712) {
          message =
            "Signature authorization invalid or expired. Please refresh the session.";
        } else if (code === 3301) {
          message =
            "The meeting passcode is incorrect. Please contact support.";
        } else if (code === 300) {
          message =
            "The Meeting SDK credentials or signature format are invalid.";
        }

        return {
          code: code,
          type: type,
          message: message,
        };
      };

      const joinMeeting = async (config) => {
        if (joinLock) return;
        joinLock = true;

        if (!window.ZoomMtgEmbedded) {
          joinLock = false;
          window.parent.postMessage(
            {
              event: "zoom_event_failed",
              error: {
                code: 0,
                type: "SDK_MISSING",
                message: "Zoom SDK script failed to load.",
              },
            },
            "*",
          );
          return;
        }

        try {
          if (!client) {
            client = window.ZoomMtgEmbedded.createClient();
          }

          const targetElement = document.getElementById("meetingSDKElement");

          // Wait until iframe layout has settled
          await new Promise((resolve) => {
            requestAnimationFrame(() => {
              requestAnimationFrame(resolve);
            });
          });

          const elW = Math.round(window.innerWidth);
          const elH = Math.round(window.innerHeight);

          targetElement.style.width = "100%";
          targetElement.style.height = "100%";

          console.log("ZOOM FINAL SIZE:", {
            width: elW,
            height: elH,
          });

          await client.init({
            zoomAppRoot: targetElement,
            zoomAppHeader: false,
            language: "en-US",
            customize: {
              video: {
                // viewSizes: {
                //   default: { width: elW, height: elH },
                //   ribbon: { width: elW, height: Math.round(elH * 0.12) },
                // },
                viewSizes: {
                  default: {
                    width: elW,
                    height: elH,
                  },
                  ribbon: {
                    width: elW,
                    height: elH,
                  },
                },
                isResizable: false,
              },
              chat: {
                popper: {
                  anchorElement: targetElement,
                  placement: "right-end",
                },
              },
            },
          });

          if (containerObserver) {
            containerObserver.disconnect();
            containerObserver = null;
          }

          containerObserver = new ResizeObserver((entries) => {
            for (const entry of entries) {
              const { width, height } = entry.contentRect;
              const w = Math.round(width);
              const h = Math.round(height);
              if (!client || w < 16 || h < 16) return;
              
              try {
                client.updateVideoOptions({
                  viewSizes: {
                    default: { width: w, height: h },
                    ribbon: { width: w, height: Math.round(h * 0.12) },
                  },
                });
              } catch (e) {
                console.warn(
                  "[Zoom ResizeObserver] updateVideoOptions skipped:",
                  e.message,
                );
              }
            }
          });

          containerObserver.observe(targetElement);

          if (chatObserver) {
            chatObserver.disconnect();
            chatObserver = null;
          }

          chatObserver = new MutationObserver(() => {
            let currentlyOpen = false;
            let chatPopupNode = null;
            
            // 1. Check known selectors
            const chatList = document.querySelector('.chat-content, .chat-container, .zoom-chat-container, #chat-list-content');
            if (chatList) {
              currentlyOpen = true;
              chatPopupNode = chatList.closest('div[role="dialog"], div[data-popper-placement] .zoom-MuiPaper-root') || chatList;
            } else {
              // 2. Check text content of potential dialogs/poppers
              const popups = document.querySelectorAll('div[role="dialog"], div[role="presentation"], div[style*="position: absolute"]');
              for (const popup of popups) {
                const text = popup.textContent || "";
                if (text.includes("Type message here") || text.includes("Who can see your messages") || text.includes("To: Everyone")) {
                  currentlyOpen = true;
                  chatPopupNode = popup;
                  break;
                }
              }
            }
            
            if (currentlyOpen !== isChatOpen) {
              isChatOpen = currentlyOpen;
              if (isChatOpen) {
                document.body.classList.add('chat-is-open');
                targetElement.style.width = `calc(100% - ${CHAT_SPACE}px)`;
              } else {
                document.body.classList.remove('chat-is-open');
                targetElement.style.width = '100%';
              }
              
              if (isChatOpen && chatPopupNode) {
                if (!document.getElementById('custom-chat-close-btn')) {
                  const closeBtn = document.createElement('div');
                  closeBtn.id = 'custom-chat-close-btn';
                  closeBtn.innerHTML = '<svg fill="#fff" viewBox="0 0 24 24" width="20px" height="20px"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
                  closeBtn.style.cssText = 'position: absolute; top: 12px; right: 40px; z-index: 9999; cursor: pointer; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 50%; transition: 0.2s;';
                  
                  closeBtn.onmouseover = () => closeBtn.style.background = 'rgba(255,255,255,0.2)';
                  closeBtn.onmouseout = () => closeBtn.style.background = 'rgba(255,255,255,0.1)';
                  
                  closeBtn.onclick = (e) => {
                    e.stopPropagation();
                    const chatToggleBtn = document.querySelector('[aria-label="Chat"], [aria-label="open chat"], [aria-label="close chat"], button[title="Chat"]');
                    if (chatToggleBtn) {
                      chatToggleBtn.click();
                      chatToggleBtn.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
                      chatToggleBtn.dispatchEvent(new MouseEvent('mouseup', {bubbles: true}));
                    } else {
                      const buttons = document.querySelectorAll('button');
                      for(let b of buttons) {
                         if(b.innerText && b.innerText.toLowerCase().includes("chat")) { 
                           b.click(); 
                           b.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
                           b.dispatchEvent(new MouseEvent('mouseup', {bubbles: true}));
                           break; 
                         }
                      }
                    }
                  };
                  
                  chatPopupNode.style.position = 'relative';
                  chatPopupNode.appendChild(closeBtn);
                }
              }
            }
          });

          // Observe the body or targetElement for added/removed chat DOM nodes
          chatObserver.observe(document.body, { childList: true, subtree: true });

          const joinParams = {
            meetingNumber: String(config.meetingNumber),
            signature: config.signature,
            sdkKey: config.sdkKey,
            password: config.passcode || "",
            userName: config.userName || "Participant",
            userEmail: config.userEmail || "",
          };

          if (config.zak) {
            joinParams.zak = config.zak;
          }

          currentConfig = {
            meetingNumber: config.meetingNumber,
            role: config.role,
          };

          await client.join(joinParams);

          window.parent.postMessage({ event: "zoom_event_joined" }, "*");
        } catch (err) {
          console.error(
            "Zoom SDK Join Failure [safe code]:",
            err.errorCode || err.code || err,
          );
          const structuredError = normalizeError(err);
          window.parent.postMessage(
            {
              event: "zoom_event_failed",
              error: structuredError,
            },
            "*",
          );
        } finally {
          joinLock = false;
        }
      };

      const leaveMeeting = () => {
        if (leaveLock) return;
        leaveLock = true;

        if (containerObserver) {
          containerObserver.disconnect();
          containerObserver = null;
        }

        if (client) {
          try {
            client.leave();
            currentConfig = null;
            window.parent.postMessage({ event: "zoom_event_left" }, "*");
          } catch (e) {
            console.error("Error triggering client leave:", e);
            currentConfig = null;
          } finally {
            leaveLock = false;
          }
        } else {
          leaveLock = false;
          window.parent.postMessage({ event: "zoom_event_left" }, "*");
        }
      };

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data) return;

        if (data.action === "zoom_action_join") {
          joinMeeting(data);
        } else if (data.action === "zoom_action_leave") {
          leaveMeeting();
        }
      });

      window.addEventListener("DOMContentLoaded", () => {
        window.parent.postMessage({ event: "zoom_event_loaded" }, "*");
      });
    </script>
  </body>
</html>
